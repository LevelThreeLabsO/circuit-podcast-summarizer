name: Probe youtube-transcript.io credits

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe API
        env:
          TOKEN: ${{ secrets.YT_TRANSCRIPT_IO_TOKEN }}
        run: |
          set +x
          echo "token length: ${#TOKEN}"
          check() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' \
              -X POST https://www.youtube-transcript.io/api/transcripts \
              -H "Authorization: Basic ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"ids\":[\"$1\"]}")
            len=$(wc -c < /tmp/body)
            b=""
            [ "$code" != "200" ] && b=" | $(sed "s|${TOKEN}|[REDACTED]|g" /tmp/body | head -c 80)"
            printf 'RESULT %-14s %-5s %-9s %s%s\n' "$1" "$code" "${len}B" "$2" "$b"
          }
          check YtO3XQVi4lM "UNCACHED - JI account gets 402 on this"
          check 5mrCEbg9tAs "UNCACHED - JI account gets 402 on this"
          check dQw4w9WgXcQ "CACHED - JI account gets 200 on this"
          echo "PROBE COMPLETE"
